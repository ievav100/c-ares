name: Rehearse c-ares release package
on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-build-release-package
  cancel-in-progress: true

env:
  TEST_FILTER: "--gtest_filter=-*LiveSearchTXT*:*LiveSearchANY*"
  MAKE: make

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
    name: "build"
    steps:
      - name: Install packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: autoconf automake libtool g++ libgmock-dev pkg-config gdb
          version: 1.0
      - name: Checkout c-ares
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Tag version
        id: version
        run: |
          version=`echo ${GITHUB_REF} | grep '^refs/tags/v' | sed -e 's|^refs/tags/v\(.*\)|\1|'`
          if [ "$version" = "" ] ; then
            version="prerelease"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: "build c-ares tarball"
        run: |
          autoreconf -fi
          ./configure
          make dist
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "c-ares-src-tarball"
          path: 'c-ares-*.tar.gz'
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Generate subject
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum c-ares-*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-tag-name: "${{ needs.build.outputs.version }}"
      draft-release: true
      # Publish the tarball and provenance together in one draft release.
      upload-assets: false
      provenance-name: "c-ares-${{ needs.build.outputs.version }}.intoto.jsonl"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c-ares-src-tarball
      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
      - name: Check the archive against the provenance subject
        env:
          SUBJECTS: ${{ needs.build.outputs.hashes }}
        run: |
          set -euo pipefail
          printf '%s' "$SUBJECTS" | base64 --decode | sha256sum --check --strict
      - name: Stage both draft release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c-ares-draft-release-assets
          path: |
            c-ares-${{ needs.build.outputs.version }}.tar.gz
            ${{ needs.provenance.outputs.provenance-name }}
          if-no-files-found: error
